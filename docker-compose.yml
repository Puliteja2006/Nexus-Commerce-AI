version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexuscommerce-postgres
    environment:
      POSTGRES_DB: nexuscommerce_db
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexuscommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexuscommerce-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexuscommerce_db
      SPRING_DATASOURCE_USERNAME: nexus_user
      SPRING_DATASOURCE_PASSWORD: nexus_secure_password_2026
      JWT_SECRET: ProductionJwtSecretKeyForNexusCommerceEnterpriseAi2026Secure256Bit
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
